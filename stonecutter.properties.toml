# Mod settings shared by every jar.
mod.id = "bettermusictoast"
mod.archive = "better-music-toast"
mod.version = "1.6.4"

deps.fabric_loader = "0.19.5"
loomx.loom_version = "1.18-SNAPSHOT"

# One section per jar. The section name is the Minecraft version the jar is compiled against,
# with "-neoforge" / "-forge" for the NeoForge and Forge jars.
#   mod.mc_label    -> suffix in the file name, e.g. better-music-toast-1.6.3+26.2.jar
#   mod.mc_compat   -> Minecraft versions the jar accepts (fabric.mod.json / neoforge.mods.toml);
#                      NeoForge writes it as a Maven range, e.g. "[1.21.2,1.21.3]"
#   mod.mc_releases -> versions to tick on Modrinth, comma-separated

