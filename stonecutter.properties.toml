# Mod settings shared by every jar.
mod.id = "bettermusictoast"
mod.archive = "better-music-toast"
mod.version = "1.6.1"

deps.fabric_loader = "0.19.5"
deps.modmenu = "20.0.3"
loomx.loom_version = "1.18-SNAPSHOT"

# One section per jar. The section name is the Minecraft version the jar is compiled against.
#   mod.mc_label    -> suffix in the file name, e.g. better-music-toast-1.6.1+26.2.jar
#   mod.mc_compat   -> Minecraft versions the jar accepts (written into fabric.mod.json)
#   mod.mc_releases -> versions to tick on Modrinth

["26.1.2"]
mod.mc_label = "26.1"
mod.mc_compat = '"~26.1"'
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]

deps.fabric_api = "0.155.3+26.1.2"

["26.2"]
mod.mc_label = "26.2"
mod.mc_compat = '["~26.2", "~26.3"]'
mod.mc_releases = ["26.2", "26.3"]

deps.fabric_api = "0.161.0+26.2"
